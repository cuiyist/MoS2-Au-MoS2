.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  #mos2-pressure-50nm .mpm-marker-adhesion { fill: var(--viz-series-2); }
  #mos2-pressure-50nm .mpm-marker-empty { fill: var(--viz-series-3); }
  #mos2-pressure-50nm .mpm-marker-au { fill: var(--viz-series-4); }
  #mos2-pressure-50nm .mpm-guide {
    stroke: var(--muted-foreground);
    stroke-width: 1;
    stroke-dasharray: 3 4;
    opacity: .8;
  }
  #mos2-pressure-50nm .table-responsive {
    margin-top: 6px;
  }
  #mos2-pressure-50nm #mpm-detail {
    margin-top: 5px;
  }
  @media (max-width: 900px) {
    #mos2-pressure-50nm .mpm-schematics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 620px) {
    #mos2-pressure-50nm .mpm-schematics { grid-template-columns: 1fr; }
    #mos2-pressure-50nm .mpm-plots { grid-template-columns: 1fr; }
  }
&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;mos2-pressure-50nm&#x27;);
  const controls = {
    thickness: root.querySelector(&#x27;#mpm-thickness&#x27;),
    gap: root.querySelector(&#x27;#mpm-gap&#x27;),
    diameter: root.querySelector(&#x27;#mpm-diameter&#x27;)
  };
  const outputs = {
    thickness: root.querySelector(&#x27;#mpm-thickness-value&#x27;),
    gap: root.querySelector(&#x27;#mpm-gap-value&#x27;),
    diameter: root.querySelector(&#x27;#mpm-diameter-value&#x27;),
    schematicDiameter: root.querySelector(&#x27;#mpm-schematic-diameter&#x27;),
    elasticTwo: root.querySelector(&#x27;#mpm-p-elastic-two&#x27;),
    elasticRigid: root.querySelector(&#x27;#mpm-p-elastic-rigid&#x27;),
    adhesion: root.querySelector(&#x27;#mpm-p-adhesion&#x27;),
    empty: root.querySelector(&#x27;#mpm-p-empty&#x27;),
    au: root.querySelector(&#x27;#mpm-p-au&#x27;),
    detail: root.querySelector(&#x27;#mpm-detail&#x27;)
  };

  const constants = {
    electronVolt: 1.602176634e-19,
    hamakerEmpty: 0.70 * 1.602176634e-19,
    hamakerAu: 0.58 * 1.602176634e-19,
    cohesion: 0.482,
    indentationModulus: 53.85e9
  };

  const chartSpec = {
    width: 360,
    height: 300,
    margin: { top: 10, right: 12, bottom: 42, left: 55 },
    yMin: 0.01,
    yMax: 100000,
    yTicks: [0.01, 0.1, 1, 10, 100, 1000, 10000, 100000]
  };

  const state = { gapNm: 2.5, thicknessNm: 50, diameterNm: 50 };
  const previous = new Map();

  function finiteSlabFactor(d, t) {
    return 1 / d ** 3 - 2 / (d + t) ** 3 + 1 / (d + 2 * t) ** 3;
  }

  function hamakerPressure(hamaker, gapNm, thicknessNm) {
    const d = gapNm * 1e-9;
    const t = thicknessNm * 1e-9;
    return hamaker * finiteSlabFactor(d, t) / (6 * Math.PI);
  }

  function adhesionPressure(gapNm) {
    return constants.cohesion / (gapNm * 1e-9);
  }

  function elasticPressure(gapNm, thicknessNm, diameterNm) {
    const h = gapNm * 1e-9;
    const a = diameterNm * 0.5e-9;
    const twoPlates = constants.indentationModulus * h / (Math.PI * a);
    return { twoPlates, rigidBase: 2 * twoPlates };
  }

  function pressures(gapNm, thicknessNm, diameterNm) {
    const elastic = elasticPressure(gapNm, thicknessNm, diameterNm);
    return {
      elastic: elastic.twoPlates,
      rigid: elastic.rigidBase,
      adhesion: adhesionPressure(gapNm),
      empty: hamakerPressure(constants.hamakerEmpty, gapNm, thicknessNm),
      au: hamakerPressure(constants.hamakerAu, gapNm, thicknessNm)
    };
  }

  function formatPressure(pa) {
    if (pa &gt;= 1e9) return `${(pa / 1e9).toFixed(2)} GPa`;
    if (pa &gt;= 1e6) return `${(pa / 1e6).toFixed(pa &gt;= 1e8 ? 0 : 2)} MPa`;
    if (pa &gt;= 1e3) return `${(pa / 1e3).toFixed(1)} kPa`;
    return `${pa.toFixed(1)} Pa`;
  }

  function makeSvg(tag, attrs = {}) {
    const node = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, tag);
    Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, value));
    return node;
  }

  function logY(valueMpa) {
    const { height, margin, yMin, yMax } = chartSpec;
    const inner = height - margin.top - margin.bottom;
    const clipped = Math.max(yMin, Math.min(yMax, valueMpa));
    const fraction = (Math.log10(clipped) - Math.log10(yMin)) / (Math.log10(yMax) - Math.log10(yMin));
    return margin.top + inner * (1 - fraction);
  }

  function linearX(value, min, max) {
    const { width, margin } = chartSpec;
    return margin.left + (value - min) / (max - min) * (width - margin.left - margin.right);
  }

  function pathFrom(points) {
    return points.map((point, index) =&gt; `${index ? &#x27;L&#x27; : &#x27;M&#x27;}${point.x.toFixed(2)},${point.y.toFixed(2)}`).join(&#x27; &#x27;);
  }

  function bandPath(lower, upper) {
    const first = pathFrom(lower);
    const back = upper.slice().reverse().map(point =&gt; `L${point.x.toFixed(2)},${point.y.toFixed(2)}`).join(&#x27; &#x27;);
    return `${first} ${back} Z`;
  }

  function addText(svg, text, x, y, className, anchor = &#x27;middle&#x27;) {
    const node = makeSvg(&#x27;text&#x27;, { x, y, class: className, &#x27;text-anchor&#x27;: anchor });
    node.textContent = text;
    svg.appendChild(node);
    return node;
  }

  function buildFrame(svg, xMin, xMax, xTicks, xLabel) {
    const { width, height, margin, yTicks } = chartSpec;
    const left = margin.left;
    const right = width - margin.right;
    const top = margin.top;
    const bottom = height - margin.bottom;

    if (xLabel.startsWith(&#x27;Gap&#x27;)) {
      const observedLeft = linearX(2.4, xMin, xMax);
      const observedRight = linearX(5.3, xMin, xMax);
      svg.appendChild(makeSvg(&#x27;rect&#x27;, {
        x: observedLeft, y: top,
        width: observedRight - observedLeft,
        height: bottom - top,
        class: &#x27;mpm-observed&#x27;
      }));
      addText(svg, &#x27;observed 2.4–5.3 nm&#x27;, (observedLeft + observedRight) / 2, top + 13, &#x27;mpm-tick&#x27;);
    }

    yTicks.forEach(value =&gt; {
      const y = logY(value);
      svg.appendChild(makeSvg(&#x27;line&#x27;, { x1: left, x2: right, y1: y, y2: y, class: &#x27;mpm-grid&#x27; }));
      addText(svg, value &gt;= 1000 ? `${value / 1000}k` : `${value}`, left - 7, y + 4, &#x27;mpm-tick&#x27;, &#x27;end&#x27;);
    });
    xTicks.forEach(value =&gt; {
      const x = linearX(value, xMin, xMax);
      svg.appendChild(makeSvg(&#x27;line&#x27;, { x1: x, x2: x, y1: top, y2: bottom, class: &#x27;mpm-grid&#x27; }));
      addText(svg, `${value}`, x, bottom + 17, &#x27;mpm-tick&#x27;);
    });
    svg.appendChild(makeSvg(&#x27;line&#x27;, { x1: left, x2: left, y1: top, y2: bottom, class: &#x27;mpm-axis&#x27; }));
    svg.appendChild(makeSvg(&#x27;line&#x27;, { x1: left, x2: right, y1: bottom, y2: bottom, class: &#x27;mpm-axis&#x27; }));
    addText(svg, xLabel, (left + right) / 2, height - 7, &#x27;mpm-axis-label&#x27;);
    const yLabel = addText(svg, &#x27;Pressure (MPa, log scale)&#x27;, 14, (top + bottom) / 2, &#x27;mpm-axis-label&#x27;);
    yLabel.setAttribute(&#x27;transform&#x27;, `rotate(-90 14 ${(top + bottom) / 2})`);
  }

  function interpolateArrays(from, to, fraction) {
    return to.map((point, index) =&gt; {
      const start = from &amp;&amp; from[index] ? from[index] : point;
      return { x: point.x, y: start.y + (point.y - start.y) * fraction };
    });
  }

  function drawChart(svg, mode, animate) {
    const isGap = mode === &#x27;gap&#x27;;
    const xMin = isGap ? 1 : 10;
    const xMax = isGap ? 8 : 100;
    const xTicks = isGap ? [1, 2, 3, 4, 5, 6, 7, 8] : [10, 25, 50, 75, 100];
    const selectedX = isGap ? state.gapNm : state.thicknessNm;
    const samples = 91;
    const arrays = { elastic: [], rigid: [], adhesion: [], empty: [], au: [] };

    for (let i = 0; i &lt; samples; i += 1) {
      const xValue = xMin + (xMax - xMin) * i / (samples - 1);
      const gap = isGap ? xValue : state.gapNm;
      const thickness = isGap ? state.thicknessNm : xValue;
      const p = pressures(gap, thickness, state.diameterNm);
      const x = linearX(xValue, xMin, xMax);
      Object.keys(arrays).forEach(key =&gt; arrays[key].push({ x, y: logY(p[key] / 1e6) }));
    }

    const key = mode;
    const old = previous.get(key);
    svg.querySelectorAll(&#x27;.mpm-dynamic&#x27;).forEach(node =&gt; node.remove());
    if (!svg.querySelector(&#x27;.mpm-axis&#x27;)) buildFrame(svg, xMin, xMax, xTicks, isGap ? &#x27;Gap / Au thickness (nm)&#x27; : &#x27;MoS₂ thickness (nm)&#x27;);

    const group = makeSvg(&#x27;g&#x27;, { class: &#x27;mpm-dynamic&#x27; });
    const band = makeSvg(&#x27;path&#x27;, { class: &#x27;mpm-band&#x27; });
    const paths = {
      elastic: makeSvg(&#x27;path&#x27;, { class: &#x27;mpm-line mpm-line-elastic&#x27; }),
      adhesion: makeSvg(&#x27;path&#x27;, { class: &#x27;mpm-line mpm-line-adhesion&#x27; }),
      empty: makeSvg(&#x27;path&#x27;, { class: &#x27;mpm-line mpm-line-empty&#x27; }),
      au: makeSvg(&#x27;path&#x27;, { class: &#x27;mpm-line mpm-line-au&#x27; })
    };
    if (!isGap) {
      const validFrom = Math.max(xMin, Math.min(xMax, state.diameterNm));
      const validLeft = linearX(validFrom, xMin, xMax);
      group.appendChild(makeSvg(&#x27;rect&#x27;, {
        x: validLeft,
        y: chartSpec.margin.top,
        width: chartSpec.width - chartSpec.margin.right - validLeft,
        height: chartSpec.height - chartSpec.margin.bottom - chartSpec.margin.top,
        class: &#x27;mpm-valid&#x27;
      }));
      const validityLabel = addText(group, &#x27;half-space valid: t ≳ diameter&#x27;, (validLeft + chartSpec.width - chartSpec.margin.right) / 2, chartSpec.margin.top + 13, &#x27;mpm-tick&#x27;);
      validityLabel.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
    }
    group.appendChild(band);
    Object.values(paths).forEach(path =&gt; group.appendChild(path));

    const selected = pressures(state.gapNm, state.thicknessNm, state.diameterNm);
    const selectedPx = linearX(selectedX, xMin, xMax);
    group.appendChild(makeSvg(&#x27;line&#x27;, {
      x1: selectedPx, x2: selectedPx,
      y1: chartSpec.margin.top, y2: chartSpec.height - chartSpec.margin.bottom,
      class: &#x27;mpm-guide&#x27;
    }));
    const markers = [
      [&#x27;elastic&#x27;, selected.elastic, &#x27;mpm-marker-elastic&#x27;],
      [&#x27;adhesion&#x27;, selected.adhesion, &#x27;mpm-marker-adhesion&#x27;],
      [&#x27;empty&#x27;, selected.empty, &#x27;mpm-marker-empty&#x27;],
      [&#x27;au&#x27;, selected.au, &#x27;mpm-marker-au&#x27;]
    ];
    markers.forEach(([, value, className]) =&gt; {
      group.appendChild(makeSvg(&#x27;circle&#x27;, {
        cx: selectedPx, cy: logY(value / 1e6), r: 4,
        class: `mpm-marker ${className}`
      }));
    });
    svg.appendChild(group);

    function renderAt(fraction) {
      const current = {};
      Object.keys(arrays).forEach(name =&gt; {
        current[name] = interpolateArrays(old &amp;&amp; old[name], arrays[name], fraction);
      });
      band.setAttribute(&#x27;d&#x27;, bandPath(current.elastic, current.rigid));
      Object.keys(paths).forEach(name =&gt; paths[name].setAttribute(&#x27;d&#x27;, pathFrom(current[name])));
    }

    const reduced = window.matchMedia &amp;&amp; window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
    if (!animate || !old || reduced) {
      renderAt(1);
    } else {
      const start = performance.now();
      const duration = 220;
      function step(now) {
        const fraction = Math.min(1, (now - start) / duration);
        renderAt(1 - (1 - fraction) ** 3);
        if (fraction &lt; 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    previous.set(key, arrays);
  }

  function update(animate = true) {
    state.thicknessNm = Number(controls.thickness.value);
    state.gapNm = Number(controls.gap.value);
    state.diameterNm = Number(controls.diameter.value);
    outputs.thickness.textContent = `${state.thicknessNm.toFixed(0)} nm`;
    outputs.gap.textContent = `${state.gapNm.toFixed(1)} nm`;
    outputs.diameter.textContent = `${state.diameterNm.toFixed(0)} nm`;
    outputs.schematicDiameter.textContent = `${state.diameterNm.toFixed(0)} nm`;

    const p = pressures(state.gapNm, state.thicknessNm, state.diameterNm);
    outputs.elasticTwo.textContent = formatPressure(p.elastic);
    outputs.elasticRigid.textContent = formatPressure(p.rigid);
    outputs.adhesion.textContent = formatPressure(p.adhesion);
    outputs.empty.textContent = formatPressure(p.empty);
    outputs.au.textContent = formatPressure(p.au);

    const halfSpaceEmpty = constants.hamakerEmpty / (6 * Math.PI * (state.gapNm * 1e-9) ** 3);
    const slabRatio = p.empty / halfSpaceEmpty;
    const ratio = p.elastic / p.au;
    const thicknessRatio = state.thicknessNm / (state.diameterNm / 2);
    const validity = thicknessRatio &gt;= 2 ? &#x27;half-space regime&#x27; : &#x27;finite-thickness correction needed&#x27;;
    outputs.detail.textContent = `t/a = ${thicknessRatio.toFixed(2)} (${validity}) · Hamaker correction: ${(100 * slabRatio).toFixed(2)}% of half-space · Elastic/Au-Hamaker ratio: ${ratio.toLocaleString(undefined, { maximumFractionDigits: 0 })}× · Γ/d is an energy-density cross-check, not a local traction`;

    drawChart(root.querySelector(&#x27;#mpm-gap-chart&#x27;), &#x27;gap&#x27;, animate);
    drawChart(root.querySelector(&#x27;#mpm-thickness-chart&#x27;), &#x27;thickness&#x27;, animate);
  }

  Object.values(controls).forEach(control =&gt; control.addEventListener(&#x27;input&#x27;, () =&gt; update(true)));
  update(false);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
